name: NEOX-BRAVE Headless Validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  headless-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Run headless validation
        run: gradle testDebugUnitTest --no-daemon
